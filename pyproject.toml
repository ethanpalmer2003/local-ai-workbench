[project]
name = "ai-scripts"
version = "0.1.0"
description = "Local launchers, benchmarks and checks for the AI stack"
requires-python = ">=3.14"
# - direct dependencies only; uv.lock carries the exact resolved set and hashes
dependencies = [
    "aiohttp",
    "huggingface-hub",
    "numpy",
    "openpyxl",
    "packaging",
    "pillow",
    "psutil",
    "python-dotenv",
    "pyyaml",
    "regex",
    "requests",
    "scipy",
    "soundfile",
    "tabulate>=0.10.0",
    "tqdm",
]

[dependency-groups]
dev = [
    "basedpyright",
    "datasets",
    "codespell",
    "coverage",
    "deptry",
    "pip-audit",
    "pre-commit",
    "pytest",
    "pytest-timeout>=2.4.0",
    "ruff",
    "vulture>=2.16",
    "networkx>=3.7",
]

[tool.uv]
# - this repository is a tree of scripts, not an installable package
package = false
# - a plain `uv sync` installs runtime deps only; `uv sync --group dev` adds the checks
default-groups = []

[tool.pytest.ini_options]
# - a hung socket or probe fails one test instead of the whole run; the model-free suite is seconds
timeout = 60
timeout_method = "thread"
# - one cache root with ruff and the launch scratch; the layout check flags a .pytest_cache in the root
cache_dir = "runs/state/cache/pytest"

[tool.pyright]
# - the repository root is the parent of the scripts package (imports are scripts.*)
include = ["scripts"]
extraPaths = ["."]
reportImplicitRelativeImport = "none"
# - the venv these launchers run in; unset, basedpyright targets a newer Python
#   and reports removed stdlib modules as unresolvable
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
exclude = ["scripts/config/comfyui/ltx_prompt_cache.py", "scripts/tests/cases/personal/comfyui/test_ltx_prompt_cache.py", "scripts/tests/retired", "runs/tests", "runs/benchmarks", "state", ".venv", "data", "frameworks", "trash"]

[tool.ruff]
cache-dir = "runs/state/cache/ruff"
line-length = 120
target-version = "py313"
include = ["*.py", "*.pyi"]
extend-exclude = ["scripts/tests/retired", "runs/tests", "runs/benchmarks", "state", ".venv", "data", "/frameworks", "trash", "scripts/config/models/ids.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# - collapse short calls/signatures even when they already have a trailing comma
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "C4", "SIM", "I", "S", "C90", "PT", "RET", "N", "RUF100", "PLC0415", "B"]
# - StrEnum changes str(member); retain existing enum string representations
# - S603/S606/S607: known local executables are launched by absolute path
# - S310: curated HTTPS URLs are fetched, not user-supplied ones
ignore = ["UP042", "S603", "S606", "S607", "S310"]

[tool.ruff.lint.per-file-ignores]
# - every suppression lives here; code carries no inline `# noqa`
# - asserts are the assertion mechanism in tests
# - PT009/PT027/PT018 want bare `assert`; the suite is unittest.TestCase by design
# - N802/N803: unittest hooks (`stopTest`) and test doubles keep the upstream names
# - S106/S307: fixed test credentials and a deliberate `eval` of the project's own graph
"scripts/tests/**" = ["S101", "PT009", "PT027", "PT018", "N802", "N803", "S106", "S307", "PLC0415"]
# - ComfyUI nodes and optional paths import their runtime only when that path runs
"scripts/config/comfyui/ltx_prompt_cache.py" = ["N802", "PLC0415"]
# - the ComfyUI node handler is looked up by name on an arbitrary class object
"scripts/config/comfyui/verify_node.py" = ["B009"]
"scripts/benchmarks/personal/comfyui/comfyui_video.py" = ["PLC0415"]
"scripts/launchers/koboldcpp/kobold.py" = ["PLC0415"]
"scripts/launchers/koboldcpp/kobold_lite.py" = ["PLC0415"]
"scripts/launchers/runtime/gpu_memory.py" = ["PLC0415"]
"scripts/download/input/voice_workflow.py" = ["PLC0415"]
# - ctypes structures mirror the Win32 job-object names verbatim
"scripts/launchers/launch_util.py" = ["N801"]
# - the Kobold UI binds all interfaces by design; that is the documented default
"scripts/launchers/launcher_speech.py" = ["S104"]
# - parses a local, project-owned vcxproj; no untrusted XML is read
"scripts/tests/cases/llamacpp/hrx/hrx_update_validation.py" = ["S314"]

[tool.ruff.lint.mccabe]
# - gate at a level the launchers already meet; tighten separately
max-complexity = 10

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.deptry]
# - reads [project].dependencies, so a direct dependency nothing imports is now a real finding
known_first_party = ["scripts"]
exclude = ["scripts/tests/retired", "runs/tests", "runs/benchmarks", "state", ".venv", "data", "frameworks", "trash"]
# - ComfyUI and Piper are imported inside their own runtimes, never from this venv;
#   torch belongs to the ComfyUI interpreter that loads the synced node
# - the regression harness imports pytest and the gate imports networkx; both are tooling, so both belong in
#   the dev group even though scripts/ imports them
per_rule_ignores = { DEP001 = ["folder_paths", "piper", "torch"], DEP004 = ["networkx", "pytest"] }
