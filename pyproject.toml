[project]
name = "ai-scripts"
version = "0.1.0"
description = "Local launchers, benchmarks and checks for the AI stack"
requires-python = ">=3.13"
# - direct dependencies only; uv.lock carries the exact resolved set and hashes
dependencies = [
    "aiohttp",
    "huggingface-hub",
    "numpy",
    "openpyxl",
    "packaging",
    "pillow",
    "psutil",
    "python-dotenv",
    "pyyaml",
    "regex",
    "requests",
    "scipy",
    "soundfile",
    "tqdm",
]

[dependency-groups]
dev = ["basedpyright", "codespell", "coverage", "deptry", "pip-audit", "pre-commit", "pytest", "ruff"]

[tool.uv]
# - this repository is a tree of scripts, not an installable package
package = false
# - a plain `uv sync` installs runtime deps only; `uv sync --group dev` adds the checks
default-groups = []
# - the interpreter lives in scripts/.venv, so uv must not create ./.venv:
#   set UV_PROJECT_ENVIRONMENT=C:/AI/scripts/.venv before any uv sync/lock command

[tool.pyright]
# - the repository root is the parent of the scripts package (imports are scripts.*)
include = ["scripts"]
extraPaths = ["."]
reportImplicitRelativeImport = "none"
# - the venv these launchers run in; unset, basedpyright targets a newer Python
#   and reports removed stdlib modules as unresolvable
pythonVersion = "3.13"
venvPath = "scripts"
venv = ".venv"
exclude = ["scripts/config/comfyui/ltx_prompt_cache.py", "scripts/tests/cases/personal/comfyui/test_ltx_prompt_cache.py", "scripts/tests/retired", "scripts/tests/output", "scripts/benchmarks/output", "scripts/state", "scripts/.venv", "data", "frameworks", "trash"]

[tool.ruff]
cache-dir = "scripts/state/cache/ruff"
line-length = 120
target-version = "py313"
include = ["*.py", "*.pyi"]
extend-exclude = ["scripts/tests/retired", "scripts/tests/output", "scripts/benchmarks/output", "scripts/state", "scripts/.venv", "data", "frameworks", "trash", "scripts/config/models/ids.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# - collapse short calls/signatures even when they already have a trailing comma
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "C4", "SIM", "I", "S", "C90", "PT", "RET", "N", "RUF100"]
# - StrEnum changes str(member); retain existing enum string representations
# - S603/S606/S607: known local executables are launched by absolute path
# - S310: curated HTTPS URLs are fetched, not user-supplied ones
ignore = ["UP042", "S603", "S606", "S607", "S310"]

[tool.ruff.lint.per-file-ignores]
# - every suppression lives here; code carries no inline `# noqa`
# - asserts are the assertion mechanism in tests
# - PT009/PT027/PT018 want bare `assert`; the suite is unittest.TestCase by design
# - N802/N803: unittest hooks (`stopTest`) and test doubles keep the upstream names
# - S106/S307: fixed test credentials and a deliberate `eval` of the project's own graph
"scripts/tests/**" = ["S101", "PT009", "PT027", "PT018", "N802", "N803", "S106", "S307"]
# - ComfyUI calls INPUT_TYPES / IS_CHANGED by name, so they cannot be snake_case
"scripts/config/comfyui/ltx_prompt_cache.py" = ["N802"]
# - ctypes structures mirror the Win32 job-object names verbatim
"scripts/launchers/launch_util.py" = ["N801"]
# - the Kobold UI binds all interfaces by design; that is the documented default
"scripts/launchers/launcher_config.py" = ["S104"]
# - parses a local, project-owned vcxproj; no untrusted XML is read
"scripts/tests/cases/llamacpp/hrx/hrx_update_validation.py" = ["S314"]

[tool.ruff.lint.mccabe]
# - gate at a level the launchers already meet; tighten separately
max-complexity = 10

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.deptry]
# - reads [project].dependencies, so a direct dependency nothing imports is now a real finding
known_first_party = ["scripts"]
exclude = ["scripts/tests/retired", "scripts/tests/output", "scripts/benchmarks/output", "scripts/state", "scripts/.venv", "data", "frameworks", "trash"]
# - ComfyUI and Piper are imported inside their own runtimes, never from this venv;
#   torch belongs to the ComfyUI interpreter that loads the synced node
# - the regression harness imports pytest, which belongs in the dev group
per_rule_ignores = { DEP001 = ["folder_paths", "piper", "torch"], DEP004 = ["pytest"] }
