# Local hooks: the project venv's binaries, so no clone and no second copy of the config.
# Two levels, each with a natural trigger: a commit checks what the change reaches, and a push checks
# everything. The same commands run by hand while working, so there is no third stage to remember.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check --fix --config pyproject.toml
        language: system
        pass_filenames: false
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/ruff.exe format --config pyproject.toml
        language: system
        pass_filenames: false
        files: \.pyi?$
      - id: codespell
        name: codespell
        entry: .venv/Scripts/codespell.exe
        language: system
        pass_filenames: true
        types_or: [python, markdown]
        exclude: ^(data|frameworks|trash|scripts/state|scripts/tests/output|scripts/benchmarks/output)/
        args: ["--ignore-words=.codespell-ignore.txt"]
      - id: ascii-punctuation
        name: ASCII punctuation only
        entry: .venv/Scripts/python.exe -m scripts.review.checks.typography
        language: system
        pass_filenames: true
        types: [text]
        exclude: ^(data|frameworks|trash|scripts/state|scripts/tests/output|scripts/benchmarks/output)/
      # - the commit level checks what the change reaches; the push level checks everything
      - id: gate-scoped
        name: review gate (scoped)
        entry: .venv/Scripts/python.exe -m scripts.review
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: suite-scoped
        name: model-free suite (scoped)
        entry: .venv/Scripts/python.exe -m scripts.tests.run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # - the push level: every section and every class, the completeness guarantee
      - id: gate-full
        name: review gate (all)
        entry: .venv/Scripts/python.exe -m scripts.review --all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: suite-full
        name: model-free suite (all)
        entry: .venv/Scripts/python.exe -m scripts.tests.run --all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Both code indexes are snapshots and nothing watches the tree, so the commit that moves code
      # is what refreshes them. A docs-only commit rebuilds the call graph and skips graphify.
      - id: refresh-indexes
        name: refresh code indexes
        entry: .venv/Scripts/python.exe -m scripts.tools.refresh_index
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [post-commit]
