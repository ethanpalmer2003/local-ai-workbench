# Local hooks: the project venv's binaries, so no clone and no second copy of the config.
# Full gate stays manual: python -m scripts.review
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: scripts/.venv/Scripts/ruff.exe check --fix --config pyproject.toml
        language: system
        pass_filenames: false
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        entry: scripts/.venv/Scripts/ruff.exe format --config pyproject.toml
        language: system
        pass_filenames: false
        files: \.pyi?$
      - id: codespell
        name: codespell
        entry: scripts/.venv/Scripts/codespell.exe
        language: system
        pass_filenames: true
        types_or: [python, markdown]
        exclude: ^(data|frameworks|trash|scripts/state|scripts/tests/output|scripts/benchmarks/output)/
        args: ["--ignore-words=.codespell-ignore.txt"]
