# What is parked, whether it still runs, why it cannot start, and what would unpark it. A capability
# row names the same thing by its subject, so the matrix reads its reason here instead of keeping a
# second list. `state` is the one fact a reader needs first: `retained` is installed and functional as
# it stands, `restorable` is kept but needs its documented restore step, and `unavailable` is not on
# this machine or cannot run on it. Table view: python -m scripts.tools.yaml_table
# scripts/config/shared/deferred.yaml
- thing: Fish Audio Drama 3, and every comparison of it
  kind: model
  state: unavailable
  subject: shared/drama3_offload
  reason: the installed 15.9 GiB TTS model ran at best RTF 1.21, slower than real time, so this setup cannot carry it
  revisit: a larger-memory target or a smaller conversion exists
  source: scripts/tools/capability_matrix.py, scripts/benchmarks/audit_timing.py
- thing: HRX llama.cpp
  kind: build
  state: retained
  revisit: HRX returns
  source: notes/UPSTREAM-INDEX.md
- thing: HRX build capability row
  kind: row
  state: restorable
  subject: probes/hrx_updates
  reason: HRX work is paused by the user; the build and its update probe stay out of the rerun set
  revisit: HRX returns
  source: scripts/tools/capability_matrix.py
- thing: llama.cpp backend benchmark
  kind: row
  state: restorable
  subject: llamacpp/benchmark_backends
  reason: its comparison arm is the paused HRX build, so the row cannot be judged while HRX is parked
  revisit: HRX returns
  source: scripts/tools/capability_matrix.py
- thing: Avalon
  kind: framework
  state: retained
  revisit: it earns another look
  source: scripts/download/frameworks/shared/other_updates.py
- thing: ExLlama family (hipfire, TabbyAPI)
  kind: framework
  state: unavailable
  reason: both need a Linux host with ROCm and EXL2/EXL3 weights rather than GGUF
  revisit: a Linux host with ROCm and EXL2/EXL3 exists
  source: notes/OPEN-QUESTIONS.md
- thing: Piper TTS
  kind: framework
  state: retained
