  revisit: a Windows release is published
  source: scripts/download/frameworks/shared/other_updates.py
- thing: Text generation WebUI
  kind: framework
  state: unavailable
  reason: it is not installed; a portable Windows zip exists but no launcher or run exercises it
  revisit: a model server is installed and exercised
  source: scripts/download/frameworks/shared/other_updates.py
- thing: Lemonade Server
  kind: framework
