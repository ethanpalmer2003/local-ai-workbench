  reason: it ships its own launcher and update path, so this repository only benchmarks it
  revisit: a model server is installed and exercised
  source: scripts/download/frameworks/shared/other_updates.py
- thing: Medium/high-context grids
  kind: work
  state: restorable
  reason: Vulkan long generations stop past 64K, so the grids cannot complete until that engine fault clears
  revisit: Vulkan long generations work
  source: notes/TODO.md, notes/reviews/LLAMACPP-VULKAN-2026-11-09.md
- thing: sdcpp ROCm runtime
  kind: runtime
  state: retained
  revisit: the ROCm runtime is validated
  source: scripts/config/sdcpp/README.md
- thing: ComfyUI autotune, quality and scaling
  kind: work
  state: restorable
  reason: tuning runs were never started because no measured reason for them has appeared
  revisit: a measured reason appears
  source: scripts/benchmarks/personal/comfyui/README.md
- thing: Unsloth quants for the two large coding models
  kind: model
  state: unavailable
  reason: neither model has a Qwen4 build from Unsloth yet
  revisit: a Qwen4 build of either model exists
  source: notes/TODO.md
- thing: Kokoro live coverage; the multilingual package stays selectable and untested
  kind: model
  state: retained
  revisit: a probe or benchmark arm speaks with it again
  source: scripts/launchers/launcher_speech.py
- thing: RDNA-boosts llama.cpp builds (ROCm and Vulkan)
  kind: build
  state: restorable
  reason: both lost to the plain Vulkan default on the 27B pair, and their checkouts and builds are archived to trash
  revisit: a patch set rebased on the current llama.cpp wins a paired screen
  source: scripts/config/llamacpp/BUILDS.md
- thing: Coding harnesses other than Pi (little-coder, ohmypi, nanocoder, DeepSeek Harness)
  kind: work
  state: restorable
  reason: Pi is the only client this host launches; the entry points wait in scripts/config/coding_agents/parked
  revisit: another harness becomes the client again
  source: notes/TODO.md
- thing: ASR test execution, Handy and Kobold coverage
  kind: work
  state: restorable
  reason: Handy has no validated microphone and no multilingual corpus is configured, so these checks wait for an instruction
  revisit: an explicit instruction
